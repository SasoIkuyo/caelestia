# Standalone emergency screen: no wallpaper, scripts or shell dependencies.
background {
    monitor =
    color = rgb(151923)
}

label {
    monitor =
    text = Bloqueo de respaldo · $USER
    font_size = 24
    color = rgb(e2e8f0)
    position = 0, 100
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 340, 60
    position = 0, 0
    halign = center
    valign = center
    outer_color = rgb(7aa2f7)
    inner_color = rgb(24283b)
    font_color = rgb(e2e8f0)
    placeholder_text = Contraseña
    fail_text = Contraseña incorrecta
    fade_on_empty = false
}
